<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/output.css">
  <title>Attendance Tracker</title>
</head>

<body class="min-h-screen bg-slate-50">
  <!-- static text is marked with data-i18n="<key>" and filled in by js/i18n.js -->
  <header id="app-header" class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 bg-white px-4 py-3 sm:px-6">
    <div class="text-lg font-semibold text-slate-900" data-i18n="app.title">Attendance Tracker</div>
    <div class="flex items-center gap-3">
      <label class="sr-only" for="lang-select" data-i18n="header.language">Language</label>
      <select id="lang-select" class="rounded-lg border border-slate-300 bg-white px-2 py-1.5 text-sm text-slate-700"></select>
      <div id="header-user" class="flex items-center gap-3" hidden>
        <span id="header-user-name" class="text-sm text-slate-500"></span>
        <button id="logout-btn" class="rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm text-slate-700 hover:bg-slate-50" data-i18n="header.logout">Log out</button>
      </div>
    </div>
  </header>

  <main id="app" class="mx-auto w-full max-w-md px-4 py-8 sm:max-w-lg"></main>

  <script type="module" src="/js/router.js"></script>
</body>

</html>
