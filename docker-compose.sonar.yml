# Local SonarQube server for static code analysis (Sprint 6, task 2).
#
#   docker compose -f docker-compose.sonar.yml up -d
#
# then open http://localhost:9000 (first login admin / admin, you are asked to pick a new password).
# Kept separate from docker-compose.yml so the application stack doesn't start SonarQube too.
# See docs/code-review/README.md for the full analysis procedure.

services:
  sonarqube:
    image: sonarqube:community
    ports:
      - "9000:9000"
    environment:
      # The embedded H2 database is fine for a local, single-user analysis server
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
