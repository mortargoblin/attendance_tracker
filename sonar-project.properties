# SonarScanner configuration for the whole repository (Java backend + JavaScript frontend).
# How to run it locally: see docs/code-review/README.md, or the "Static code analysis" section
# of the root README.
#
# The server must be built first (./mvnw verify in server/) so that compiled classes and the
# JaCoCo XML coverage report exist.

sonar.projectKey=attendance-tracker
sonar.projectName=Attendance Tracker
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

# Production code only; tests are listed separately so they don't count towards issues/metrics
sonar.sources=server/src/main/java,client/js
sonar.tests=server/src/test/java

# Java analysis needs the compiled bytecode and the classpath
sonar.java.source=21
sonar.java.binaries=server/target/classes
sonar.java.test.binaries=server/target/test-classes
sonar.java.libraries=server/target/dependency/*.jar
sonar.java.test.libraries=server/target/dependency/*.jar

# Coverage produced by `./mvnw verify` (jacoco-maven-plugin report goal)
sonar.coverage.jacoco.xmlReportPaths=server/target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=server/target/surefire-reports

# Generated / third-party files that should not be analysed
sonar.exclusions=client/css/**,client/node_modules/**,**/*.min.js
