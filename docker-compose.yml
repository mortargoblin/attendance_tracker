services:
  db:
    image: mariadb:11
    # UTF-8 (utf8mb4) as the server default for new databases, tables and connections.
    # The backend's MariaDB Connector/J 3.x always talks utf8mb4, and the SQL scripts
    # start with SET NAMES utf8mb4, so every path into the database is UTF-8.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: attendance_tracker
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./attendance_tracker_v2.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      # init scripts run in name order: schema.sql, then this, then the demo data
      - ./database_localization.sql:/docker-entrypoint-initdb.d/y_localization.sql:ro
      - ./demo_data.sql:/docker-entrypoint-initdb.d/zz_demo_data.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mariadb://db:3306/attendance_tracker
      DB_USER: root
      DB_PASSWORD: root
      PORT: 3000
      CORS_ORIGINS: http://127.0.0.1:1337,http://localhost:1337
    ports:
      - "3000:3000"

volumes:
  db_data:
