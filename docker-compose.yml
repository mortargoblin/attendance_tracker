services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: attendance_tracker
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./attendance_tracker_v2.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mariadb://db:3306/attendance_tracker
      DB_USER: root
      DB_PASSWORD: root
      PORT: 3000
      CORS_ORIGINS: http://127.0.0.1:1337,http://localhost:1337
    ports:
      - "3000:3000"

volumes:
  db_data:
