name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Build, test, coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests with JaCoCo (fails if coverage is below the pom.xml thresholds)
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode verify

      - name: Print coverage summary
        if: always()
        run: |
          echo "### JaCoCo coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Class | Lines | Branches |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|----------|" >> "$GITHUB_STEP_SUMMARY"
          tail -n +2 target/site/jacoco/jacoco.csv | awk -F, '{
            printf "| %s | %d/%d | %d/%d |\n", $3, $9, $8+$9, $7, $6+$7
          }' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: server/target/site/jacoco

      - name: Prepare report for GitHub Pages
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: server/target/site/jacoco

  publish-report:
    name: Publish coverage report to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
